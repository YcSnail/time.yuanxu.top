# time.yuanxu.top nginx vhost —— 部署到 /usr/local/nginx/conf/vhost/time.yuanxu.top.conf
# 证书签发后(acme.sh)启用 443;域名 A 记录需指向本机 47.102.212.238
server
    {
        listen 80;
        listen 443 ssl;
        server_name time.yuanxu.top;
        index index.html index.htm;
        root  /home/wwwroot/time.yuanxu.top;

        # HTTP -> HTTPS 跳转
        if ($server_port !~ 443){
            rewrite ^(/.*)$ https://${server_name}$1 permanent;
        }

        ssl_certificate /usr/local/nginx/conf/ssl/time.yuanxu.top/ssl.pem;
        ssl_certificate_key /usr/local/nginx/conf/ssl/time.yuanxu.top/ssl.key;

        include rewrite/ssl.conf;

        location /.well-known/acme-challenge/ {
            root /home/wwwroot/time.yuanxu.top;
        }

        # 前端静态资源 → 前端容器(8082)
        location / {
            proxy_pass http://127.0.0.1:8082;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # API → 后端容器(8095,host 网络)
        location /api/ {
            proxy_pass http://127.0.0.1:8095;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        access_log  /home/wwwlogs/time.yuanxu.top.log;
    }
